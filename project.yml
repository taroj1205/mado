name: Mado
options:
  bundleIdPrefix: com.taroj1205
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    OTHER_SWIFT_FLAGS: "-enable-upcoming-feature ExistentialAny -enable-upcoming-feature InternalImportsByDefault -enable-upcoming-feature MemberImportVisibility -enable-upcoming-feature InferIsolatedConformances -enable-upcoming-feature NonisolatedNonsendingByDefault -enable-upcoming-feature ImmutableWeakCaptures -strict-memory-safety"

packages:
  AppCore:
    path: Packages/AppCore
  GlassUI:
    path: Packages/GlassUI
  InputKit:
    path: Packages/InputKit
  WindowKit:
    path: Packages/WindowKit
  SearchKit:
    path: Packages/SearchKit
  ClipboardKit:
    path: Packages/ClipboardKit

targets:
  Mado:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: AppCore
      - package: GlassUI
      - package: InputKit
      - package: WindowKit
      - package: SearchKit
      - package: ClipboardKit
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Mado
        CFBundleDisplayName: Mado
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSAutoFillRequiresTextContentTypeForOneTimeCodeOnMac: true
        NSMicrophoneUsageDescription: Mado listens only while you hold or toggle the dictation key, and the audio stays on this Mac.
        NSLocationUsageDescription: Mado uses your location only to show the weather for where you are. It sends Open-Meteo a position rounded to about a kilometre.
        NSAppleEventsUsageDescription: Mado asks Finder to empty the Trash, System Events to lock the screen and switch dark mode, the login window to show the restart dialog, Music or Spotify to show and play or pause the current song, and Calendar to open an event you pick.
        NSCalendarsFullAccessUsageDescription: Mado reads your calendars to list today's and tomorrow's events when you search for them. Events stay on this Mac.
    entitlements:
      path: App/Mado.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.location: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taroj1205.mado
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_DEBUG_DYLIB: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Mado Development"

  MadoTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/MadoTests]
    dependencies:
      - package: AppCore
      - package: GlassUI
      - package: InputKit
      - package: WindowKit
      - package: SearchKit
      - package: ClipboardKit
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"

schemes:
  Mado:
    build:
      targets:
        Mado: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MadoTests
        - package: AppCore/AppCoreTests
        - package: ClipboardKit/ClipboardKitTests
        - package: GlassUI/GlassUITests
        - package: InputKit/InputKitTests
        - package: SearchKit/SearchKitTests
        - package: WindowKit/WindowKitTests
