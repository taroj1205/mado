name: Flake hunt

on:
  push:
    branches: [claude/flaky-ci-tests-9f90cd]

permissions:
  contents: read

jobs:
  hunt:
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew install xcodegen && xcodegen generate
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/CompilationCache.noindex
          key: xcode-cache-${{ runner.arch }}-${{ github.sha }}
          restore-keys: xcode-cache-${{ runner.arch }}-
      - run: |
          xcodebuild build-for-testing -project Mado.xcodeproj -scheme Mado \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_LIMIT_SIZE=1G -quiet
      - run: |
          sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string
          defaults read -g AppleShowScrollBars || true
          for i in $(seq 1 8); do
            xcodebuild test-without-building -xctestrun build/Build/Products/*.xctestrun \
              -destination 'platform=macOS' -parallel-testing-enabled YES \
              -resultBundlePath "r$i.xcresult" > "r$i.log" 2>&1 && echo "run $i passed" && continue
            echo "run $i FAILED"
            xcrun xcresulttool get test-results tests --path "r$i.xcresult" --compact \
              | jq -r '.. | objects | select(.result? == "Failed" and .nodeType? == "Test Case")
                  | .nodeIdentifier, (.children[]? | select(.nodeType == "Failure Message") | "  " + .name)'
          done
