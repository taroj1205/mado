name: CI
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen swiftlint
      - name: Format check
        run: swift format lint --strict -r App Packages Tests
      - name: Lint
        run: swiftlint lint --strict
      - name: Package unit tests
        run: |
          for p in Packages/*/; do
            (cd "$p" && swift test)
          done
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build and test the app workspace
        run: |
          xcodebuild test \
            -project Mado.xcodeproj \
            -scheme Mado \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
      - name: Launch smoke test
        run: |
          xcodebuild build \
            -project Mado.xcodeproj \
            -scheme Mado \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
          build/Build/Products/Debug/Mado.app/Contents/MacOS/Mado &
          pid=$!
          sleep 3
          kill -0 "$pid"
          lsappinfo info -only ApplicationType -app "$pid" | grep -q UIElement
          kill "$pid"
