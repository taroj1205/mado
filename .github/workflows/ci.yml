name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: filter
        env:
          NOT_CODE: '\.md$|^\.github/ISSUE_TEMPLATE/|^\.github/dependabot\.yml$|^\.githooks/|^\.agents/'
          APP_ONLY: '^(App|Tests)/|^project\.yml$'
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "packages=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          code=false
          packages=false
          grep -qvE "$NOT_CODE" "$RUNNER_TEMP/changed" && code=true
          grep -qvE "$NOT_CODE|$APP_ONLY" "$RUNNER_TEMP/changed" && packages=true
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Format check
        run: swift format lint --strict -r App Packages Tests

      - name: Lint
        run: swiftlint lint --strict

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    uses: ./.github/workflows/test-packages.yml

  app:
    name: App
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test
        run: |
          xcodebuild test \
            -project Mado.xcodeproj \
            -scheme Mado \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Launch smoke test
        run: |
          xcodebuild build \
            -project Mado.xcodeproj \
            -scheme Mado \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
          build/Build/Products/Debug/Mado.app/Contents/MacOS/Mado &
          pid=$!
          sleep 3
          kill -0 "$pid"
          lsappinfo info -only ApplicationType -app "$pid" | grep -q UIElement
          kill "$pid"

  verify:
    name: Verify
    needs: [changes, lint, test, app]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "CI failed - one or more required jobs failed or were cancelled"
            exit 1
          fi

          echo "CI passed"
