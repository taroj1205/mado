name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/dependabot.yml'
              - '!.githooks/**'
              - '!.agents/**'

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Format check
        run: swift format lint --strict -r App Packages Tests

      - name: Lint
        run: swiftlint lint --strict

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the scheme runs every package's tests
        run: |
          for dir in Packages/*/Tests/*/; do
            package=${dir#Packages/}
            package=${package%%/*}
            target=$(basename "$dir")
            grep -qE "^ +- package: $package/$target$" project.yml || {
              echo "::error file=project.yml::Add '- package: $package/$target' to the Mado scheme's test targets"
              exit 1
            }
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/CompilationCache.noindex
          key: xcode-cache-${{ runner.arch }}-${{ github.sha }}
          restore-keys: xcode-cache-${{ runner.arch }}-

      - name: Build
        run: |
          xcodebuild build-for-testing \
            -project Mado.xcodeproj \
            -scheme Mado \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_LIMIT_SIZE=1G

      - name: Save build cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/CompilationCache.noindex
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Launch smoke test
        run: |
          build/Build/Products/Debug/Mado.app/Contents/MacOS/Mado &
          pid=$!
          sleep 3
          kill -0 "$pid"
          lsappinfo info -only ApplicationType -app "$pid" | grep -q UIElement
          kill "$pid"

      - name: Pack test products
        run: tar -czf products.tar.gz -C build/Build/Products .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: products
          path: products.tar.gz
          compression-level: 0
          retention-days: 1

  test:
    name: Test ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: build
    runs-on: xcode-27
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: products

      - name: Unpack test products
        run: |
          mkdir -p build/Build/Products
          tar -xzf products.tar.gz -C build/Build/Products

      - name: Test
        run: |
          xcodebuild test-without-building \
            -xctestrun build/Build/Products/*.xctestrun \
            -destination 'platform=macOS' \
            -parallel-testing-enabled YES \
            $(scripts/shard-args.sh ${{ matrix.shard }} ${{ strategy.job-total }})

  verify:
    name: Verify
    needs: [changes, lint, build, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "CI failed - one or more required jobs failed or were cancelled"
            exit 1
          fi

          echo "CI passed"
