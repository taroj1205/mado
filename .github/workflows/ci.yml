name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/dependabot.yml'
              - '!.githooks/**'
              - '!.agents/**'

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Format check
        run: swift format lint --strict -r App Packages Tests

      - name: Lint
        run: swiftlint lint --strict

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the scheme runs every package's tests
        run: |
          for dir in Packages/*/Tests/*/; do
            package=${dir#Packages/}
            package=${package%%/*}
            target=$(basename "$dir")
            grep -qE "^ +- package: $package/$target$" project.yml || {
              echo "::error file=project.yml::Add '- package: $package/$target' to the Mado scheme's test targets"
              exit 1
            }
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and test
        run: |
          xcodebuild test \
            -project Mado.xcodeproj \
            -scheme Mado \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -parallel-testing-enabled YES \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Launch smoke test
        run: |
          build/Build/Products/Debug/Mado.app/Contents/MacOS/Mado &
          pid=$!
          sleep 3
          kill -0 "$pid"
          lsappinfo info -only ApplicationType -app "$pid" | grep -q UIElement
          kill "$pid"

  verify:
    name: Verify
    needs: [changes, lint, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "CI failed - one or more required jobs failed or were cancelled"
            exit 1
          fi

          echo "CI passed"
