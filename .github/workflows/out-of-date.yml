name: Out of date

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  comment:
    name: Comment
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MARKER: <!-- out-of-date -->
    steps:
      - name: Flag PRs behind main
        shell: bash
        run: |
          gh pr list --base main --state open --limit 100 --json number,headRefOid,author \
            --jq '.[] | select(.author.is_bot | not) | "\(.number) \(.headRefOid)"' |
          while read -r number head; do
            behind=$(gh api "repos/$GH_REPO/compare/main...$head" --jq .behind_by)
            ids=$(gh api --paginate "repos/$GH_REPO/issues/$number/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith(env.MARKER))) | .id')
            id=${ids%%$'\n'*}
            body="$MARKER
          This branch is $behind commit(s) behind \`main\`. Merge \`main\` into it or rebase it to bring it up to date."

            if [[ $behind -gt 0 && -z $id ]]; then
              gh api "repos/$GH_REPO/issues/$number/comments" -f body="$body" --silent
            elif [[ $behind -gt 0 ]]; then
              gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" --silent
            elif [[ -n $id ]]; then
              gh api -X DELETE "repos/$GH_REPO/issues/comments/$id" --silent
            fi
          done
